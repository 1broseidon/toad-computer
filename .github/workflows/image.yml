# The computer image, built for both architectures a desk runs on and
# published as one name. Each architecture builds on its own runner — a
# Rust release build and an X server from source are hours under emulation
# and minutes native — pushes by digest, and a last job stitches the two
# digests into the manifest the desk pulls.
#
# A tag `v<version>` publishes `<version>` and `latest`; the tag must match
# Cargo.toml, because an image that says one version and carries another is
# a desk that pins the wrong thing. A hand-run builds and publishes `edge`.
name: image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        run: |
          set -eu
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$crate" ]; then
              echo "tag v$tag does not match Cargo.toml version $crate" >&2
              exit 1
            fi
            echo "tags=${IMAGE}:${crate},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:edge" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          # A cache that cannot be written is a slower build, not a failed one.
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max,ignore-error=true
      # An artifact path may not carry a colon, so the digest is filed
      # without its `sha256:` and gets it back when the manifest is made.
      - run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -eu
          tags=""
          for tag in $(echo "${{ needs.version.outputs.tags }}" | tr ',' ' '); do tags="$tags -t $tag"; done
          digests=""
          for digest in digests/*; do digests="$digests ${IMAGE}@sha256:$(basename "$digest")"; done
          docker buildx imagetools create $tags $digests
      - run: docker buildx imagetools inspect "$(echo "${{ needs.version.outputs.tags }}" | cut -d, -f1)"
